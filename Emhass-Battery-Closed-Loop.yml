alias: EMHASS – Batterie Closed Loop (Mode 8 Script)
description: MPC Closed Loop mit Mode 8 (Laden/Halten), Entladen = Disabled, SOC-Notstopp
triggers:
  - minutes: /1
    trigger: time_pattern
conditions:
  - condition: state
    entity_id: input_boolean.emhass_mpc_ready
    state: "on"
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ soc_now <= 22 }}"
        sequence:
          - target:
              entity_id: input_text.lade_automations_status
            data:
              value: 🛑 SOC Notstopp – RemoteControl Disabled
            action: input_text.set_value
          - action: script.solax_remotecontrol_disabled
          - stop: SOC Notstopp
      - conditions:
          - condition: template
            value_template: "{{ p_batt > 50 }}"
        sequence:
          - target:
              entity_id: input_text.lade_automations_status
            data:
              value: ⚡ Entladen erkannt → RemoteControl Disabled
            action: input_text.set_value
          - action: script.solax_remotecontrol_disabled
      - conditions: []
        sequence:
          - target:
              entity_id: input_text.lade_automations_status
            data:
              value: |
                {% if active_power < 0 %}
                  🔌 Mode 8 – Laden
                {% else %}
                  🔒 Mode 8 – Halten (Freeze Charge)
                {% endif %}
            action: input_text.set_value
          - data:
              active_power: "{{ active_power }}"
              duration: 75
            action: script.solax_mode8_apply
mode: single
variables:
  p_batt: "{{ states('sensor.p_batt_forecast') | float(0) }}"
  soc_now: "{{ states('sensor.qcells_battery_capacity') | float(0) }}"
  soc_target: "{{ states('sensor.soc_batt_forecast') | float(0) }}"
  active_power: |
    {% if p_batt < -50 and soc_now < soc_target %}
      {{ p_batt | round(0) }}
    {% else %}
      0
    {% endif %}
