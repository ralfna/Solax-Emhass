alias: SolaX Mode8 – Apply
description: "Mode 8 remote control set for charge and hold battery, set maxPVPower and max active power accordingly"
mode: queued
fields:
  active_power:
    description: |
      Positive = Discharge (Export) Negative = Charge (Import)
    selector:
      number:
        min: -8000
        max: 8000
    required: true
  duration:
    selector:
      number:
        min: 60
        max: 86400
    default: 28800
sequence:
  - variables:
      maxPvPower: 12000
  - target:
      entity_id: number.qcells_remotecontrol_push_mode_power_8_9
    data:
      value: "{{ active_power | round(0) }}"
    action: number.set_value
  - target:
      entity_id: number.qcells_remotecontrol_pv_power_limit
    data:
      value: "{{ maxPvPower }}"
    action: number.set_value
  - target:
      entity_id: number.qcells_remotecontrol_duration
    data:
      value: 30
    action: number.set_value
  - target:
      entity_id: number.qcells_remotecontrol_timeout
    data:
      value: 300
    action: number.set_value
  - target:
      entity_id: number.qcells_remotecontrol_autorepeat_duration
    data:
      value: "{{ duration }}"
    action: number.set_value
  - target:
      entity_id: select.qcells_inverter_remotecontrol_timeout_next_motion_mode_1_9
    data:
      option: VPP Off
    action: select.select_option
  - target:
      entity_id: select.qcells_remotecontrol_power_control_mode
    data:
      option: Mode 8 - PV and BAT control - Duration
    action: select.select_option
  - target:
      entity_id: button.qcells_powercontrolmode8_trigger
    action: button.press
    data: {}

